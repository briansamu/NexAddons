name: Bug Report
description: Report a crash, broken feature, or compatibility issue.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report this.
  - type: input
    id: minecraft-version
    attributes:
      label: Minecraft Version
      placeholder: "1.21.11"
    validations:
      required: true
  - type: input
    id: mod-version
    attributes:
      label: NexAddons Version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Include steps to reproduce and what you expected.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or Crash Report
      render: text
